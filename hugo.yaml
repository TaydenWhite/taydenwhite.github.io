baseURL: https://taydenwhite.github.io/
title: Tayden White
languageCode: en-us
copyright: Tayden White

enableRobotsTXT: true
enableGitInfo: true

taxonomies:
  tag: tags

outputs:
  home: [HTML]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

imaging:
  quality: 80
  resampleFilter: Lanczos

menus:
  main:
    - name: Projects
      pageRef: /projects
      weight: 10
    - name: Research
      pageRef: /research
      weight: 20
    - name: Experience
      pageRef: /experience
      weight: 30
    - name: About
      pageRef: /about
      weight: 40
    - name: Resume
      pageRef: /resume
      weight: 50
      params:
        button: true

params:
  description: >-
    Tayden White studies Computer Science and Mathematical Economics at Purdue
    University (Class of 2027) and works across software engineering, machine
    learning, and research.
  shareImage: images/share.png
  repo: https://github.com/TaydenWhite/taydenwhite.github.io
  # GoatCounter site code (the "code" in https://<code>.goatcounter.com).
  # Analytics load only in production builds when this is set.
  goatcounter: ""

module:
  hugoVersion:
    # Extended is required for WebP image encoding.
    extended: true
    min: 0.146.0
