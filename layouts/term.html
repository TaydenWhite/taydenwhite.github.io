{{ define "main" }}
<header class="container page-head">
  {{ partial "breadcrumb.html" . }}
  <h1>{{ .Title }}</h1>
  <p class="lead">Projects and research tagged “{{ .Title }}”.</p>
</header>
<div class="container">
  <div class="card-grid">
    {{- range .Pages.ByWeight }}{{ partial "card.html" . }}{{ end }}
  </div>
</div>
{{ end }}
