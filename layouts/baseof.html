<!doctype html>
<html lang="en">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | js.Build (dict "minify" true) | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
